<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price | apollo doggie studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">apollo doggie studio</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/price/" class="active">Price</a>
      <a href="/gallery/">Gallery</a>
      <a href="/studio/">Studio</a>
      <a href="/qa/">Q&A</a>
      <a href="/reservation/">ご予約</a>
    </nav>
  </div>
</header>

<section class="price-page">
  <div class="section-title">
    <h2>PRICE</h2>
  </div>

  <div class="plan-card">
    <h3 class="plan-name">studio photo plan</h3>

    <ul class="plan-specs">
      <li><span class="spec-label">撮影時間</span><span class="spec-value">60分</span></li>
      <li><span class="spec-label">データ</span><span class="spec-value">80枚程度</span></li>
    </ul>

    <ul class="plan-features">
      <li>ご家族みんなでの撮影も可</li>
      <li>わんこは2頭まで同料金</li>
    </ul>

    <div class="plan-price">
      <h4>Price</h4>
      <div class="price-grid">
        <div class="price-box">
          <p class="price-label">平日</p>
          <p class="price-value">¥38,500</p>
        </div>
        <div class="price-box">
          <p class="price-label">土日祝</p>
          <p class="price-value">¥44,000</p>
        </div>
      </div>
    </div>
  </div>

  <div class="location-block">
    <h4>Location</h4>
    <div class="access-item">
      <p class="access-label">車でお越しの場合</p>
      <p class="access-text">つくばエクスプレス研究学園駅から約10分<br>スタジオ前に3台分駐車可能です。</p>
    </div>
    <div class="access-item">
      <p class="access-label">電車でお越しの場合</p>
      <p class="access-text">研究学園駅からバス停「酒丸」下車、徒歩2分</p>
    </div>
  </div>
</section>

<footer>
  &copy; 2026 apollo doggie studio
</footer>

</body>
</html>
